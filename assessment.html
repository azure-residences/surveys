ue, "label": "What happens once the handover is complete?"}, {"id": "S7-02", "type": "status", "req": true, "label": "Is there follow-up in the first week? By whom, when exactly, on which channel, and is it recorded?"}, {"id": "S7-03", "type": "status", "req": true, "label": "If the resident reports a defect in the first days, what route does it take? Who tells them it is closed?"}, {"id": "S7-04", "type": "status", "req": true, "label": "Is the resident introduced to the facilities, services and opening hours? When?"}, {"id": "S7-07", "type": "status", "req": true, "label": "Is there an organized orientation or welcome session for new residents? How often, and who prepares it?"}, {"id": "S7-05", "type": "status", "req": true, "label": "What do new residents usually ask about in their first days?"}, {"id": "S7-06", "type": "status", "req": true, "label": "At what point is the onboarding considered finished?"}], "n": 10}, {"title": "Stage 8: Feedback", "intro": "", "q": [{"id": "S8-01", "type": "status", "req": true, "label": "Does the compound receive the resident's view of their move-in? How?"}, {"id": "S8-02", "type": "status", "req": true, "label": "Who collects it, and is it recorded anywhere?"}, {"id": "S8-03", "type": "status", "req": true, "label": "If it is negative: what happens?"}], "n": 11}, {"title": "Materials", "intro": "", "q": [{"id": "MAT-01", "type": "status", "req": true, "label": "Which materials does the resident actually receive, and at what point? (welcome pack, handbook, welcome letter, maps, contacts, forms, checklists, QR codes)"}, {"id": "MAT-02", "type": "status", "req": true, "label": "In what form: printed, PDF, a link?"}], "n": 12}, {"title": "Systems", "intro": "", "q": [{"id": "SYS-01", "type": "status", "req": true, "label": "At what point in the process is each system used? (Yardi, My Community, AI Concierge, WhatsApp, email)"}, {"id": "SYS-02", "type": "status", "req": true, "label": "Which steps are done outside Yardi even though const root=document.getElementById('root');
let step=0, _sending=false;
let auth=null;      // {compound, code, manager, password}
let signinBusy=false;
const state={};
let board={seq:CARDS.slice(),unused:[]};

function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({step,state,board,auth}));}catch(e){}}
function loadProgress(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return;const d=JSON.parse(r);
  if(d&&d.state){Object.assign(state,d.state);if(d.board)board=d.board;if(d.auth)auth=d.auth;step=Math.min(d.step||0,SECTIONS.length-1);}}catch(e){}}
function clearProgress(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function stStyle(i,sel){
  return sel
    ? `background:${S_SEL[i]};border-color:${S_SEL[i]};color:#fff;font-weight:700;`
    : `background:${S_IDLE[i]};border-color:${S_BORD[i]};color:${S_TXT[i]};`;
}

function renderQ(q){
  const req=q.req?'<span class="az-req">*</span>':'';
  const lbl=`<label class="az-qlabel">${esc(q.label)}${req}</label>`;
  if(q.type==="status"){
    const cur=state[q.id+"::st"];
    const btns=STATUS.map((s,i)=>
      `<div class="az-st" data-st="${q.id}" data-i="${i}" style="${stStyle(i,String(cur)===String(i))}">${s}</div>`).join('');
    return `<div class="az-q">${lbl}
      <div class="az-status">${btns}</div>
      <textarea class="az-textarea" data-id="${q.id}" placeholder="Describe what happens today">${esc(state[q.id]||'')}</textarea>
    </div>`;
  }
  if(q.type==="longtext")
    return `<div class="az-q">${lbl}<textarea class="az-textarea" data-id="${q.id}">${esc(state[q.id]||'')}</textarea></div>`;
  if(q.type==="text")
    return `<div class="az-q">${lbl}<input class="az-input" data-id="${q.id}" value="${esc(state[q.id]||'')}"></div>`;
  if(q.type==="select"){
    const o=['<option value="">Select…</option>'].concat(q.opts.map(x=>
      `<option ${state[q.id]===x?'selected':''}>${esc(x)}</option>`)).join('');
    return `<div class="az-q">${lbl}<select class="az-select" data-id="${q.id}">${o}</select></div>`;
  }
  if(q.type==="checks"){
    const sel=Array.isArray(state[q.id])?state[q.id]:[];
    const o=q.opts.map(x=>{const on=sel.indexOf(x)>=0;
      return `<div class="az-chk ${on?'sel':''}" data-chk="${q.id}" data-v="${esc(x)}"><div class="box"></div>${esc(x)}</div>`;}).join('');
    return `<div class="az-q">${lbl}${o}</div>`;
  }
  return '';
}

function renderBoard(innerOnly){
  const cs=c=>{const k=CAT[c];const v=CATC[k]||["#fff","#e1e8eb","#13303d"];
    return {bg:v[0],bd:v[1],tx:v[2],cat:k||""};};
  const seq=board.seq.map((c,i)=>{const s=cs(c);
    return `<div class="az-card-item" draggable="true" data-z="seq" style="background:${s.bg};border-color:${s.bd}" data-seq="${i}">
      <div class="grip">\u2630</div>
      <div class="no" style="background:${s.tx}">${i+1}</div>
      <div class="tx">${esc(c)}${s.cat?`<span class="cat" style="color:${s.tx}">${s.cat}</span>`:''}</div>
      <div class="az-mv"><button data-up="${i}">\u2191</button><button data-dn="${i}">\u2193</button><button data-rm="${i}">\u00d7</button></div></div>`;}).join('');
  const un=board.unused.map((c,i)=>{const s=cs(c);
    return `<div class="az-card-item" draggable="true" data-z="un" style="opacity:.62;background:${s.bg};border-color:${s.bd}" data-un="${i}">
      <div class="grip">\u2630</div>
      <div class="tx">${esc(c)}${s.cat?`<span class="cat" style="color:${s.tx}">${s.cat}</span>`:''}</div>
      <div class="az-mv"><button data-add="${i}">+</button></div></div>`;}).join('');
  const lg=Object.keys(CATC).map(k=>{const v=CATC[k];
    return `<span class="az-lg" style="background:${v[0]};border-color:${v[1]};color:${v[2]}">${k}</span>`;}).join('');
  const inner=`<div class="az-legend">${lg}</div>
    <div class="az-bl">Steps at your compound, in order <span>${board.seq.length}</span></div>
    <div class="az-zone ${board.seq.length?'used':''}" id="zone_seq" data-zone="seq">${seq||'<div style="font-size:12.5px;color:#8a99a1;padding:6px">All steps have been moved to the box below</div>'}</div>
    <div class="az-bl">Steps we do not do <span>${board.unused.length}</span></div>
    <div class="az-zone" id="zone_un" data-zone="un">${un||'<div style="font-size:12.5px;color:#8a99a1;padding:6px">Drag anything you do not do into this box</div>'}</div>
    <div class="az-addrow"><input id="az_newcard" placeholder="Add a step we do that is not listed"><button class="az-addbtn" id="az_addcard">Add</button></div>`;
  return innerOnly?inner:`<div class="az-board">${inner}</div>`;
}

function renderSignin(msg,busy){
  root.innerHTML=`<div class="az-stage"><div class="az-shell">
    <div class="az-brandbar"><img class="az-logoimg" src="${LOGO}" alt="Azure">
      <div class="az-brandtext"><div class="t">Resident Onboarding Standard Project</div>
      <div class="s">Compound assessment</div></div>
      <div class="az-ribbon">Internal · Compound Assessment</div></div>
    <div class="az-card">
      <div class="az-hero"><div class="az-kicker">Sign in</div>
        <h1>Compound Assessment</h1>
        <p>Please enter the access code sent to you. Your answers are recorded against your compound and are seen only by the project team.</p></div>
      <div class="az-body" style="padding-top:22px">
        <div class="az-q"><label class="az-qlabel">Access code</label>
          <input class="az-input" id="az_pin" type="text" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" placeholder="e.g. LAM-0000"></div>
        <button class="az-next" id="az_signin" style="max-width:none;width:100%"
          ${busy?'disabled style="opacity:.6;max-width:none;width:100%"':''}>${busy?'Checking…':'Continue'}</button>
        <div id="az_hint" style="font-size:12.5px;color:#c0392b;margin-top:12px">${msg||''}</div>
      </div>
    </div>
    <div class="az-foot"><b>Azure Community Management</b> — Riyadh, Saudi Arabia</div>
  </div></div>`;
  const inp=document.getElementById('az_pin');
  const go=()=>trySignin(inp.value);
  document.getElementById('az_signin').onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter')go();};
  inp.focus();
}

function signOut(){
  const filled = Object.keys(state).length>0;
  if(filled && !confirm("Sign out and clear the answers entered on this device?")) return;
  clearProgress();
  Object.keys(state).forEach(function(k){ delete state[k]; });
  board={seq:CARDS.slice(),unused:[]};
  auth=null; step=0; _sending=false;
  renderSignin();
}

function trySignin(pin){
  pin=(pin||'').trim();
  if(!pin){
    const h=document.getElementById('az_hint');
    if(h)h.textContent='Please enter your access code.';
    const i=document.getElementById('az_pin'); if(i)i.focus();
    return;
  }
  if(signinBusy)return; signinBusy=true;
  const inpEl=document.getElementById('az_pin');
  const btnEl=document.getElementById('az_signin');
  const hintEl=document.getElementById('az_hint');
  if(hintEl)hintEl.textContent='';
  if(inpEl){inpEl.disabled=true;inpEl.style.opacity='.7';}
  if(btnEl){btnEl.disabled=true;btnEl.textContent='Checking\u2026';btnEl.style.opacity='.65';}
  const release=function(msg){
    signinBusy=false;
    if(inpEl){inpEl.disabled=false;inpEl.style.opacity='';}
    if(btnEl){btnEl.disabled=false;btnEl.textContent='Continue';btnEl.style.opacity='';}
    if(hintEl)hintEl.textContent=msg||'';
    if(inpEl){inpEl.focus();inpEl.select();}
  };
  const cb='azcb'+Date.now();
  const done=function(res){
    signinBusy=false;
    delete window[cb];
    if(res&&res.result==='ok'){
      auth={compound:res.compound,code:res.code,manager:res.manager,password:pin};
      step=0; saveProgress(); render();
    } else {
      release('That code was not recognised. Please check and try again.');
    }
  };
  window[cb]=done;
  const sc=document.createElement('script');
  sc.src=ENDPOINT+'?action=signin&token='+encodeURIComponent(TOKEN)
        +'&password='+encodeURIComponent(pin)+'&callback='+cb;
  sc.onerror=function(){ delete window[cb];
    release('Could not reach the server. Please check your connection and try again.'); };
  document.body.appendChild(sc);
  setTimeout(function(){ if(window[cb]){ delete window[cb];
    release('The server did not respond. Please try again.'); } },15000);
}

function render(keep){
  const y=keep?window.scrollY:0;
  const sec=SECTIONS[step];
  const pct=Math.round(((step+1)/SECTIONS.length)*100);
  let qhtml='';
  if(sec.welcome){
    qhtml=`<div class="az-welcome">
      <div class="w1">${auth&&auth.manager?('Welcome, '+esc(auth.manager)):'Welcome'}</div>
      <div class="w2">${esc(auth?auth.compound:'')}</div>
      <button class="az-signout" id="az_out">Not you? Sign out</button>
    </div>`;
  }
  else if(sec.board){ qhtml=renderBoard(); }
  else {
    let lastGroup='';
    qhtml=sec.q.map(q=>{
      let pre='';
      if(q.group&&q.group!==lastGroup){pre=`<div class="az-group">${esc(q.group)}</div>`;lastGroup=q.group;}
      return pre+renderQ(q);
    }).join('');
    if(sec.q.some(q=>q.type==="status")) qhtml=`<div class="az-hintline">${S_HINT}</div>`+qhtml;
  }
  root.innerHTML=`<div class="az-stage"><div class="az-shell">
    <div class="az-brandbar"><img class="az-logoimg" src="${LOGO}" alt="Azure">
      <div class="az-brandtext"><div class="t">Resident Onboarding Standard Project</div>
      <div class="s">Compound assessment</div></div>
      <div class="az-ribbon">Internal · Compound Assessment</div></div>
    <div class="az-card">
      <div class="az-hero"><div class="az-kicker">Section ${sec.n} of ${SECTIONS.length}</div>
        <h1>${esc(sec.title)}</h1>${sec.intro?`<p>${esc(sec.intro)}</p>`:''}</div>
      <div class="az-progress"><div class="az-track"><div class="az-fill" style="width:${pct}%"></div></div>
        <div class="az-step"><b>${pct}%</b></div></div>
      <div class="az-body">${qhtml}
        <div style="display:flex;gap:10px;margin-top:8px">
          ${step>0?'<button class="az-back" id="backBtn">Back</button>':''}
          <button class="az-next" id="nextBtn" style="max-width:none">${step===SECTIONS.length-1?'Submit':'Continue'}</button>
        </div>
        <div id="az_hint" style="font-size:12.5px;color:#c0392b;margin-top:10px"></div>
      </div>
    </div>
    <div class="az-foot"><b>Azure Community Management</b> \u2014 Riyadh, Saudi Arabia
      ${auth&&auth.compound?`<div style="margin-top:8px"><button class="az-signout" id="az_out2">Sign out</button></div>`:''}
    </div>
  </div></div>`;
  wire();
  if(keep){
    window.scrollTo(0,y);
    requestAnimationFrame(function(){ window.scrollTo(0,y); });
    setTimeout(function(){ window.scrollTo(0,y); },0);
  } else {
    window.scrollTo(0,0);
    requestAnimationFrame(function(){ window.scrollTo(0,0); });
  }
}

// re-draw the board and keep the anchored card exactly where it was on screen
function refreshBoard(anchor){
  const el=root.querySelector('.az-board');
  if(!el)return;
  let off=null;
  if(anchor){
    const a=root.querySelector(anchor.sel);
    if(a) off=a.getBoundingClientRect().top;
  }
  const y=window.scrollY;
  el.innerHTML=renderBoard(true);
  wireBoard();
  const restore=function(){
    if(anchor&&off!==null){
      const a2=root.querySelector(anchor.after);
      if(a2){ window.scrollTo(0, window.scrollY + (a2.getBoundingClientRect().top - off)); return; }
    }
    window.scrollTo(0,y);
  };
  restore();
  requestAnimationFrame(restore);
}

let dragFrom=null;

function moveCard(fromZone,fromIdx,toZone,toIdx){
  const src = fromZone==="seq"?board.seq:board.unused;
  const dst = toZone==="seq"?board.seq:board.unused;
  if(fromIdx<0||fromIdx>=src.length)return;
  const card = src.splice(fromIdx,1)[0];
  if(toIdx==null||toIdx>dst.length)toIdx=dst.length;
  dst.splice(toIdx,0,card);
  saveProgress();
  refreshBoard();
}

function indexFromPoint(zoneEl,y){
  const items=[...zoneEl.querySelectorAll('.az-card-item')];
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    if(y < r.top + r.height/2) return i;
  }
  return items.length;
}

function wireDrag(){
  root.querySelectorAll('.az-card-item[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragFrom={zone:el.dataset.z,idx:+(el.dataset.seq!=null?el.dataset.seq:el.dataset.un)};
      el.classList.add('drag');
      try{e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move';}catch(x){}
    });
    el.addEventListener('dragend',()=>{el.classList.remove('drag');dragFrom=null;
      root.querySelectorAll('.az-zone').forEach(z=>z.classList.remove('over'));});
  });
  root.querySelectorAll('.az-zone').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{
      e.preventDefault(); z.classList.remove('over');
      if(!dragFrom)return;
      const to=z.dataset.zone;
      let ti=indexFromPoint(z,e.clientY);
      if(dragFrom.zone===to && ti>dragFrom.idx) ti--;
      moveCard(dragFrom.zone,dragFrom.idx,to,ti);
      dragFrom=null;
    });
  });
  // touch: long-press then move
  root.querySelectorAll('.az-card-item .grip').forEach(g=>{
    const el=g.parentElement;
    let timer=null, active=false, ghost=null;
    g.addEventListener('touchstart',e=>{
      timer=setTimeout(()=>{
        active=true; el.classList.add('drag');
        dragFrom={zone:el.dataset.z,idx:+(el.dataset.seq!=null?el.dataset.seq:el.dataset.un)};
      },220);
    },{passive:true});
    g.addEventListener('touchmove',e=>{
      if(!active){clearTimeout(timer);return;}
      e.preventDefault();
      const t=e.touches[0];
      root.querySelectorAll('.az-zone').forEach(z=>{
        const r=z.getBoundingClientRect();
        z.classList.toggle('over', t.clientY>=r.top && t.clientY<=r.bottom);
      });
    },{passive:false});
    g.addEventListener('touchend',e=>{
      clearTimeout(timer);
      if(!active){return;}
      active=false; el.classList.remove('drag');
      const t=e.changedTouches[0];
      let done=false;
      root.querySelectorAll('.az-zone').forEach(z=>{
        const r=z.getBoundingClientRect();
        if(!done && t.clientY>=r.top && t.clientY<=r.bottom){
          const to=z.dataset.zone;
          let ti=indexFromPoint(z,t.clientY);
          if(dragFrom && dragFrom.zone===to && ti>dragFrom.idx) ti--;
          if(dragFrom) moveCard(dragFrom.zone,dragFrom.idx,to,ti);
          done=true;
        }
      });
      root.querySelectorAll('.az-zone').forEach(z=>z.classList.remove('over'));
      dragFrom=null;
    });
  });
}

function wireBoard(){
  root.querySelectorAll('[data-add]').forEach(b=>{b.onclick=()=>{
    const i=+b.dataset.add;board.seq.push(board.unused[i]);board.unused.splice(i,1);saveProgress();
    refreshBoard({sel:'[data-un="'+i+'"]',after:'.az-addrow'});};});
  root.querySelectorAll('[data-rm]').forEach(b=>{b.onclick=()=>{
    const i=+b.dataset.rm;board.unused.push(board.seq[i]);board.seq.splice(i,1);saveProgress();
    refreshBoard({sel:'[data-seq="'+i+'"]',after:'[data-seq="'+Math.min(i,board.seq.length-1)+'"]'});};});
  root.querySelectorAll('[data-up]').forEach(b=>{b.onclick=()=>{
    const i=+b.dataset.up; if(i>0){const t=board.seq[i-1];board.seq[i-1]=board.seq[i];board.seq[i]=t;saveProgress();
    refreshBoard({sel:'[data-seq="'+i+'"]',after:'[data-seq="'+(i-1)+'"]'});}};});
  root.querySelectorAll('[data-dn]').forEach(b=>{b.onclick=()=>{
    const i=+b.dataset.dn; if(i<board.seq.length-1){const t=board.seq[i+1];board.seq[i+1]=board.seq[i];board.seq[i]=t;saveProgress();
    refreshBoard({sel:'[data-seq="'+i+'"]',after:'[data-seq="'+(i+1)+'"]'});}};});
  wireDrag();
  const ab=document.getElementById('az_addcard');
  if(ab)ab.onclick=()=>{const inp=document.getElementById('az_newcard');const v=inp.value.trim();
    if(v){board.seq.push(v);inp.value='';saveProgress();refreshBoard({sel:'.az-addrow',after:'.az-addrow'});}};
  wireDrag();
}

function wire(){
  root.querySelectorAll('[data-id]').forEach(el=>{
    el.oninput=el.onchange=()=>{state[el.dataset.id]=el.value;saveProgress();};
  });
  root.querySelectorAll('[data-st]').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.st, i=el.dataset.i;
      state[id+"::st"]=i; saveProgress();
      root.querySelectorAll('[data-st="'+id+'"]').forEach(x=>{
        x.setAttribute('style', stStyle(+x.dataset.i, x.dataset.i===i));
      });
    };
  });
  root.querySelectorAll('[data-chk]').forEach(el=>{
    el.onclick=()=>{const k=el.dataset.chk,v=el.dataset.v;
      const a=Array.isArray(state[k])?state[k].slice():[];
      const i=a.indexOf(v); if(i>=0)a.splice(i,1); else a.push(v);
      state[k]=a;saveProgress();el.classList.toggle('sel');};
  });
  wireBoard();
  const so=[document.getElementById('az_out'),document.getElementById('az_out2')];
  so.forEach(function(x){ if(x)x.onclick=signOut; });
  const nb=document.getElementById('nextBtn'); if(nb)nb.onclick=next;
  const bb=document.getElementById('backBtn'); if(bb)bb.onclick=()=>{step--;render();};
}

function validate(){
  const sec=SECTIONS[step];
  if(sec.board)return null;
  for(const q of sec.q){
    if(!q.req)continue;
    if(q.type==="status"){
      if(state[q.id+"::st"]==null) return "Please choose a status for: "+q.label;
    } else if(q.type==="checks"){
      if(!Array.isArray(state[q.id])||!state[q.id].length) return "Please tick at least one option, or None of these.";
    } else if(!state[q.id]) return "Please answer: "+q.label;
  }
  return null;
}

function next(){
  const err=validate();
  const h=document.getElementById('az_hint');
  if(err){ if(h)h.textContent=err; return; }
  if(step===SECTIONS.length-1){submit();return;}
  step++; saveProgress(); render();
}

function buildPayload(){
  const answers={};
  SECTIONS.forEach(sec=>sec.q.forEach(q=>{
    if(q.type==="status"){
      const i=state[q.id+"::st"];
      answers[q.id+" | status"]=i!=null?STATUS[+i]:"";
      answers[q.id+" | answer"]=state[q.id]||"";
    } else if(q.type==="checks"){
      answers[q.id]=Array.isArray(state[q.id])?state[q.id].join("; "):"";
    } else {
      answers[q.id]=state[q.id]||"";
    }
  }));
  answers["BOARD | sequence"]=board.seq.join(" > ");
  answers["BOARD | not done"]=board.unused.join("; ");
  return {token:TOKEN,hp:(document.getElementById('az_hp')||{}).value||"",
    responseId:"A"+Date.now()+Math.floor(Math.random()*1000),
    surveyType:SURVEY_TYPE,ts:new Date().toISOString(),
    responseDate:new Date().toISOString().slice(0,10),
    password:auth?auth.password:"",
    compound:auth?auth.compound:"",name:auth?auth.manager:"",answers};
}

async function submit(){
  if(_sending)return; _sending=true;
  const btn=document.getElementById('nextBtn');
  if(btn){btn.disabled=true;btn.textContent="Submitting\u2026";btn.style.opacity="0.65";}
  const p=buildPayload();
  if(ENDPOINT&&ENDPOINT.indexOf("PASTE_")===-1){
    try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(p)});}
    catch(e){console.error(e);}
  }
  clearProgress();
  root.querySelector('.az-card').innerHTML=
    `<div class="az-done"><div class="az-check"><svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg></div>
     <h2>Thank you</h2><p>Your answers have been recorded${auth&&auth.compound?(' for '+esc(auth.compound)):''}. Please email the materials you ticked to Majed. If anything needs following up, we will contact you.</p>
     <button class="az-next" id="az_done_out" style="max-width:280px;width:100%;margin-top:6px">Start another compound</button></div>`;
  const dob=document.getElementById('az_done_out');
  if(dob)dob.onclick=function(){
    clearProgress();
    Object.keys(state).forEach(function(k){ delete state[k]; });
    board={seq:CARDS.slice(),unused:[]};
    auth=null; step=0; _sending=false;
    renderSignin();
  };
  scrollTop();
}

try{loadProgress();}catch(e){}
if(auth&&auth.compound) render(); else renderSignin();
</script>
